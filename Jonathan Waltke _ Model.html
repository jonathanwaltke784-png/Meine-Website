<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jonathan Waltke / Model</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--bg2:#e4e0d8;--ink:#2b2a28;--mute:#77746d;--line:#9c988f;--btn:#2b2220;--btnt:#f4f2ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--bg2:#262421;--ink:#ece8e0;--mute:#a09b91;--line:#6a665e;--btn:#ece8e0;--btnt:#1c1b1a}}
:root[data-theme="dark"]{--bg:#1c1b1a;--bg2:#262421;--ink:#ece8e0;--mute:#a09b91;--line:#6a665e;--btn:#ece8e0;--btnt:#1c1b1a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Libre Baskerville",Georgia,"Times New Roman",serif}
header{display:flex;justify-content:space-between;align-items:baseline;padding:28px 5vw 0;font-size:15px}
header .brand{color:var(--mute);text-decoration:none}
nav a{font-family:Helvetica,Arial,sans-serif;font-size:13px;color:var(--ink);text-decoration:none;margin-left:22px;padding-bottom:2px;border-bottom:1px solid transparent}
nav a.on{border-bottom-color:var(--ink)}
.page{display:none}.page.on{display:block}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:4vw;padding:48px 8vw 0;align-items:start}
.row img{width:100%;display:block;aspect-ratio:3/4.3;object-fit:cover}
.row img:nth-child(odd){margin-top:0}.row img:nth-child(even){margin-top:34px}
h1.name{font-weight:400;font-size:clamp(34px,5.2vw,64px);text-align:center;color:var(--mute);margin:56px 0 56px;letter-spacing:.01em}
.split{display:grid;grid-template-columns:auto 1fr;gap:5vw;padding:0 8vw;align-items:center}
.pair{display:flex;gap:10px}.pair img{width:min(18vw,230px);aspect-ratio:3/4.3;object-fit:cover;display:block}
.split h2{font-weight:400;font-size:clamp(32px,4.4vw,56px);line-height:1.1;margin:0 0 0 6vw}
.contact{padding:90px 8vw 70px;max-width:980px}
.contact h2{font-weight:400;font-size:clamp(30px,4vw,48px);margin:0 0 40px}
form{font-family:Helvetica,Arial,sans-serif;font-size:14px;display:grid;gap:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block}label small{color:var(--mute);font-size:11px;margin-left:4px}
label>span{display:block;margin-bottom:6px;font-size:13px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:18px;padding:11px 16px}
textarea{min-height:130px;resize:vertical;border-radius:20px}
input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
button{justify-self:start;font:inherit;font-weight:600;background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:13px 30px;cursor:pointer}
.ok{display:none;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:var(--mute)}
footer{background:var(--bg2);padding:46px 8vw;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
footer .n{font-size:clamp(22px,2.6vw,32px)}
footer a.mail{font-size:clamp(18px,2.2vw,28px);color:var(--ink);text-decoration:none}
footer small{display:block;margin-top:12px;font-family:Helvetica,Arial,sans-serif;font-size:11px;color:var(--mute)}
footer small a{color:var(--mute)}
.legal{padding:80px 8vw;max-width:760px;font-size:15px;line-height:1.7}
.legal h2{font-weight:400}.legal em{color:var(--mute)}
@media (max-width:720px){
.row{grid-template-columns:1fr 1fr;gap:16px;padding:32px 6vw 0}.row img:nth-child(even){margin-top:0}
.split{grid-template-columns:1fr;gap:28px;padding:0 6vw}.pair img{width:calc(50% - 5px)}.split h2{margin:0}
.pair{width:100%}.two{grid-template-columns:1fr}.contact{padding:60px 6vw}
footer{padding:36px 6vw}}
</style></head><body>
